<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RTSP player demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    form { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
    input { flex: 1; min-width: 240px; padding: 8px; }
    small { color: #555; }
  </style>
  <script type="importmap">
    { "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    } }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { RtspPlayer } from '/packages/react/dist/index.js';
    const h = React.createElement;
    const server = `ws://${location.host}/rtsp`;

    function App() {
      const [input, setInput] = useState('');
      const [url, setUrl] = useState('');
      const [status, setStatus] = useState('');
      return h('div', null,
        h('h2', null, 'react-rtsp-player demo'),
        h('form', { onSubmit: (e) => { e.preventDefault(); setUrl(input.trim()); } },
          h('input', { placeholder: 'rtsp://user:pass@192.168.1.10:554/stream1', value: input, onChange: (e) => setInput(e.target.value) }),
          h('button', null, 'Play')),
        h('div', { className: 'grid' },
          h('div', null,
            h(RtspPlayer, { stream: 'test', server, controls: true, onStatusChange: setStatus, wrapperStyle: { aspectRatio: '16/9' } }),
            h('small', { id: 'status' }, 'test stream: ', status)),
          url && h('div', null,
            h(RtspPlayer, { url, server, wrapperStyle: { aspectRatio: '16/9' } }),
            h('small', null, url))));
    }
    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
